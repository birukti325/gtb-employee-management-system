# ── Server (Disabled Web Server) ─────────────────────────
# Setting port to -1 prevents Spring from spinning up an embedded server
server.port=-1

# ── Local PostgreSQL Database ─────────────────────────────
spring.datasource.url=jdbc:postgresql://localhost:5434/gtb_employee_db
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver


# ── Connection Pool (HikariCP Optimizations) ──────────────
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.initialization-fail-timeout=0

# ── JPA / Hibernate (Speed Tweaks) ───────────────────────
# Changed from 'update' to 'none' or 'validate' to avoid boot schema scanning
spring.jpa.hibernate.ddl-auto=none

# REMOVED deprecated hibernate.dialect property (saves ~2 seconds on boot)
# spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Disabled SQL logging (I/O printing to console slows down execution)
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# ── Performance Optimizations ────────────────────────────
# Defer initialization of non-critical Spring Beans until needed
spring.main.lazy-initialization=true

# Disable Spring Boot startup background pre-initialization overhead
spring.backgroundpreinit=false

# ── App Name ──────────────────────────────────────────────
spring.application.name=GtbEmployeeManagementSystem